esphome:
  name: felicity-lifepo4
  friendly_name: Felicity LifePo4

esp8266:
  board: esp12e

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
   static_ip: 192.168.178.200
   gateway: 192.168.178.1
   subnet: 255.255.255.0
   dns1: 1.1.1.1

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Felicity-Lifepo4"
    password: "v5zdho8cUneo"

captive_portal:



uart:
  id: mod_uart
  tx_pin: 1  
  rx_pin: 3  
  baud_rate: 9600

modbus:
  send_wait_time: 250ms
  uart_id: mod_uart
  id: mod_bus

modbus_controller:
- id: m1
  address: 1
  modbus_id: mod_bus
  command_throttle: 100ms
  setup_priority: -10
  update_interval: 5s


sensor:

# Version information

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "BMS Version"
    register_type: holding
    skip_updates: 720
    address: 0xF80B
    value_type: U_WORD

  
# Charger and discharge information 

  - platform: modbus_controller
    modbus_controller_id: m1
    name: "Charge Voltage Limit"
    register_type: holding
    address: 0x131C
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    lambda: return x * 0.01;

