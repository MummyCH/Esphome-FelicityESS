text_sensor:
  - platform: template
    name: "Battery Status Text"
    icon: mdi:battery
    lambda: |-
      uint16_t status = id(battery_status_raw).state;
      std::string text = "";
      if (status & 0x01) {
        text += "Charge Enable, ";
      } else {
        text += "Charge Disable, ";
      }
      if (status & 0x02) {
        text += "Charge Immediately, ";
      } else {
        text += "Charge Not Immediate, ";
      }
      if (status & 0x04) {
        text += "Discharge Enable";
      } else {
        text += "Discharge Disable";
      }
      return text;

  - platform: template
    name: "Fault Status Text"
    icon: mdi:alert
    lambda: |-
      uint16_t status = id(fault_status_raw).state;
      std::string text = "";
      if (status & 0x04) {
        text += "Cell Voltage High, ";
      }
      if (status & 0x08) {
        text += "Cell Voltage Low, ";
      }
      if (status & 0x10) {
        text += "Charge Current High, ";
      }
      if (status & 0x20) {
        text += "Discharge Current High, ";
      }
      if (status & 0x40) {
        text += "BMS Temperature High, ";
      }
      if (status & 0x100) {
        text += "Cell Temperature High, ";
      }
      if (status & 0x200) {
        text += "Cell Temperature Low";
      }
      if (text.empty()) {
        text = "No Faults";
      } else {
        // Remove trailing comma and space
        text = text.substr(0, text.length() - 2);
      }
      return text;


    




  